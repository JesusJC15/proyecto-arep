name: arep-ci

on:
  push:
  pull_request:

jobs:
  backend-frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arep_test
          POSTGRES_USER: arep
          POSTGRES_PASSWORD: arep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arep -d arep_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e .

      - name: Backend checks and tests
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://arep:arep@127.0.0.1:5432/arep_test
          AREP_JWT_SECRET: ci-secret-key-with-32-bytes-minimum
        run: |
          python -m compileall app
          python -m pytest -q

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end flow
        working-directory: frontend
        run: npm run test:e2e

  compose-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose smoke up
        run: docker compose up --build -d

      - name: Wait for backend readiness
        run: |
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/ready && exit 0
            sleep 5
          done
          exit 1

      - name: Validate app endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/rag/status
          curl -fsS http://127.0.0.1:4173

      - name: Compose smoke down
        if: always()
        run: docker compose down -v
